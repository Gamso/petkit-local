name: tests

permissions:
  contents: read

# Third-party actions are pinned to a commit SHA, not a tag. `@v6` is a moving
# tag: whoever controls that repository can point it at new code, which then
# runs here — and `publish` runs with `packages: write`. That has happened in
# the wild. The trailing comment is the release each SHA belongs to; to update
# one, resolve the tag yourself rather than trusting the comment:
#
#   gh api repos/docker/build-push-action/commits/v6 --jq .sha

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: addon

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # One version, the one the add-on image ships (Dockerfile:
          # python:3.14) and the floor pyproject.toml declares. Testing a
          # second one would only matter if something ran on it.
          python-version: "3.14"
          cache: pip
          # setup-python resolves this from the repo root, not from
          # defaults.run.working-directory.
          cache-dependency-path: addon/requirements-dev.lock
      - name: Install ffmpeg
        # The stitcher and video-thumbnail tests drive a real ffmpeg and skip
        # without one, and the runner image does not ship it. Those are the
        # tests guarding the one code path that deletes media (media/stitch.py).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        # The image's lock (requirements.lock) plus the test and lint tools,
        # every one pinned and hashed, so the suite runs on exactly the
        # versions the image ships -- tests/test_requirements_lock.py holds the
        # two locks, requirements.txt and pyproject.toml together. The package
        # itself is not installed: pytest and `python -c` import it from here,
        # as the image does from its copy of the tree.
        run: pip install --require-hashes --no-deps -r requirements-dev.lock
      - name: Import every module
        # The suite never imports some runtime-only modules (mqtt/broker.py is
        # one), so an ImportError there would otherwise reach a device instead
        # of failing CI.
        run: |
          python -c "
          import importlib, pkgutil, petkit_local
          for mod in pkgutil.walk_packages(petkit_local.__path__, 'petkit_local.'):
              importlib.import_module(mod.name)
          "
      - name: Run test suite
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: addon/requirements-dev.lock
      # Narrow on purpose (see [tool.ruff.lint] in pyproject.toml): a gate
      # against real defects, not a style enforcer. Four unused imports reached
      # main before this existed, because the only check anyone ran locally was
      # a pyflakes that turned out not to be installed.
      # ruff comes from the dev lock like everything else, so a new ruff
      # release cannot turn the gate red on a change that did not touch it.
      - name: Lint
        run: |
          pip install --require-hashes --no-deps -r requirements-dev.lock
          ruff check petkit_local/ tests/
      # The panel's CSS/JS are prettier-formatted, and until now the only thing
      # enforcing that was a line in CLAUDE.md asking people to run it by hand.
      # No package.json needed — npx matches how it is run locally.
      - name: Check panel formatting
        run: npx prettier@3 --check petkit_local/web/static/js/*.js petkit_local/web/static/styles.css

  # The suite tests the code; this tests the image. 2.3.0 passed the suite and
  # then died on every start, because nothing in CI ever started the broker
  # with its TLS listener on. tests/smoke/run.sh starts the built image with
  # docker-compose.yml's command and drives it as a T5 would (smoke.py says
  # what is checked). amd64 only, natively: no QEMU, and the layer cache
  # makes a code-only change a rebuild of the last two layers. The other two
  # architectures are build-image.yml's job.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build the amd64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./addon
          platforms: linux/amd64
          load: true
          tags: petkit-local:smoke
          # The scope publish.yml's amd64 leg uses, so a tag's build starts
          # from the layers the last run on main left behind.
          cache-from: type=gha,scope=linux/amd64
          cache-to: type=gha,mode=max,scope=linux/amd64
      - name: Smoke test
        run: bash tests/smoke/run.sh petkit-local:smoke
