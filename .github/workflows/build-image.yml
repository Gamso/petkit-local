name: build-image

permissions:
  contents: read

# The image has to BUILD on every architecture config.yaml advertises, and
# nobody here owns 32-bit ARM hardware to find out on. Nothing else catches
# this: the Python suite passes happily while the image is unbuildable, which
# is exactly what shipped once — armv7 was listed as supported while
# `cryptography` had no musllinux armv7 wheel, so it would have failed on
# first install for every one of those users.
#
# QEMU makes it slow but it only has to be correct. armv7 is the whole point:
# it takes the Debian branch of the Dockerfile and is the only arch that
# compiles its dependencies from source.
#
# It runs only for a pull request that changes what the image is built from.
# The Dockerfile installs ffmpeg and `requirements.lock`, fetches go2rtc, and
# copies `pyproject.toml` and the package; it runs none of the code. A change
# to Python or the panel alone produces the same layers with different files
# copied in at the end, so it cannot fail here, and paying three QEMU builds
# for it on every pull request bought nothing.
#
# A release is still covered whatever this skips: `publish.yml` builds all
# three architectures on a `v*` tag and publishes nothing unless every one
# succeeds. Run this by hand (Actions -> build-image -> Run workflow) to check
# a branch anyway, e.g. after a base image moved.
#
# Third-party actions are pinned to a commit SHA, not a tag; see tests.yml.

on:
  pull_request:
    paths:
      - addon/Dockerfile
      - addon/requirements.txt
      - addon/requirements.lock
      - addon/pyproject.toml
      - .github/workflows/build-image.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64, linux/arm/v7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Emulation for the two ARM targets. Free on amd64, so not conditional.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      # TARGETARCH is a BuildKit built-in and the legacy builder leaves it
      # empty, so the per-arch base selection needs buildx to work at all.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the add-on image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./addon
          platforms: ${{ matrix.platform }}
          push: false
