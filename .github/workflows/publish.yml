name: publish

# Home Assistant's Supervisor pulls `image:` from config.yaml at the add-on's
# own version, so a tag named after a version is a PROMISE that that version is
# released. The version and `latest` are therefore cut by a `v*` git tag and
# nothing else: working on main never overwrites the released version's image
# with unreleased code.
#
# A push to main publishes nothing. It used to push a moving `dev` image on
# every merge, three QEMU builds a time for an image no install pulls. A `dev`
# build can still be had on demand: run this workflow by hand (Actions ->
# publish -> Run workflow) on any branch.
#
# A tag publishes only if the test suite and the lint pass on that exact
# commit (`checks` below), and the amd64 image built from it passes the smoke
# test (`smoke`). The Supervisor pulls the version the moment it is released,
# so a red tag must never reach it.
#
# ONE image, multi-arch. That is what the add-on documentation asks for --
# `{arch}` in the image name is described there as a compatibility fallback --
# and it is also what docker-compose needs, since Compose has no `{arch}`
# substitution. So the three architectures build in parallel, are pushed into
# the same package BY DIGEST (no tag, so the jobs cannot race for one), and a
# manifest list is assembled from them afterwards.
# Third-party actions are pinned to a commit SHA, not a tag. `@v6` is a moving
# tag: whoever controls that repository can point it at new code, which then
# runs here — and `publish` runs with `packages: write`. That has happened in
# the wild. The trailing comment is the release each SHA belongs to; to update
# one, resolve the tag yourself rather than trusting the comment:
#
#   gh api repos/docker/build-push-action/commits/v6 --jq .sha

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The built-in GITHUB_TOKEN can push to ghcr.io/<owner>/* once it is allowed to.
# No PAT and no repository secret is involved.
permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same gate as tests.yml, on the commit being published. Not reused with
  # `uses:`: a called workflow inherits the caller's `github.workflow`, so
  # tests.yml's concurrency group would collide with this one's and cancel it.
  checks:
    runs-on: ubuntu-latest
    # Nothing here pushes, so it does not get the workflow's packages: write.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: addon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # What the add-on image ships (Dockerfile: python:3.14).
          python-version: "3.14"
          cache: pip
          cache-dependency-path: addon/requirements-dev.lock
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        # Pinned and hashed, as in tests.yml.
        run: pip install --require-hashes --no-deps -r requirements-dev.lock
      - name: Lint
        run: ruff check petkit_local/ tests/
      - name: Run test suite
        run: pytest -q

  # The image this tag would publish, built for amd64 and driven as a device
  # would drive it (tests/smoke/run.sh) -- the check that would have kept
  # 2.3.0, which died on every start, from being pushed at all. Its own job so
  # it runs beside `checks`; `build` waits for both, so a failure here pushes
  # nothing. The amd64 leg of `build` then rebuilds from this job's cache
  # (same scope), out of the same pinned base and the same lock.
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./addon
          platforms: linux/amd64
          load: true
          tags: petkit-local:smoke
          cache-from: type=gha,scope=linux/amd64
          cache-to: type=gha,mode=max,scope=linux/amd64
      - name: Smoke test
        run: bash addon/tests/smoke/run.sh petkit-local:smoke

  build:
    needs: [checks, smoke]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64, linux/arm/v7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Emulation for the two ARM targets, and buildx because TARGETARCH is a
      # BuildKit built-in that the legacy builder leaves empty -- the per-arch
      # base selection in the Dockerfile does not work without it.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A registry path must be lowercase; a GitHub owner need not be.
      - name: Registry path
        id: image
        run: echo "ref=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./addon
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ steps.image.outputs.ref }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # An empty file named after the digest: the merge job only needs the
      # names, and this is the shape `download-artifact` reassembles cleanly.
      - name: Hand the digest to the merge job
        run: |
          set -eu
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Assemble the manifest and name it
        run: |
          set -eu
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Refuse a tag that disagrees with config.yaml rather than
            # publishing an image the Supervisor will never ask for: it pulls
            # by the version in that file and nothing else.
            declared=$(sed -n 's/^version: *"\(.*\)"$/\1/p' addon/config.yaml)
            version="${GITHUB_REF_NAME#v}"
            if [ "$declared" != "$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match config.yaml version $declared"
              exit 1
            fi
            primary="$version"
            tags="-t ${image}:${version} -t ${image}:latest"
          else
            # A manual run on a branch. Just the one moving tag. A per-commit
            # tag would be a second name for something the digest already
            # identifies permanently, and it would leave a tagged version
            # behind on every run -- which GitHub
            # then shows as the package's headline, offering a `docker pull` of
            # an unreleased build to anyone who lands on the page.
            # `org.opencontainers.image.revision` on the image itself is what
            # maps a build back to its commit.
            primary="dev"
            tags="-t ${image}:dev"
          fi

          sources=""
          for d in /tmp/digests/*; do
            sources="$sources ${image}@sha256:$(basename "$d")"
          done

          # shellcheck disable=SC2086
          docker buildx imagetools create $tags $sources
          docker buildx imagetools inspect "${image}:${primary}"
